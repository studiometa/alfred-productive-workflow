name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the v prefix (e.g. 0.0.7, or 0.1.0-beta.1 for a prerelease)'
        type: string
        required: true

concurrency: release

jobs:
  release:
    name: Changelog and tag
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: read
    outputs:
      body: ${{ steps.changelog.outputs.body }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The changelog action reads the commit that added each fragment.
          fetch-depth: 0

      - name: Check version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version \"$VERSION\". Use X.Y.Z or X.Y.Z-beta.N, without the v prefix."
            exit 1
          fi

          if git rev-parse --quiet --verify "refs/tags/$VERSION" > /dev/null; then
            echo "::error::The tag $VERSION already exists."
            exit 1
          fi

          PRERELEASE=false
          if [[ $VERSION == *-* ]]; then
            PRERELEASE=true
          fi

          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Fold changelog fragments
        id: changelog
        uses: weareikko/changelog@600f4225cfd2778967eaffa693e86666c5a2d4bd # 1.0.2
        with:
          command: release
          version: v${{ inputs.version }}

      - name: Fail when there is nothing to release
        if: steps.changelog.outputs.changed != 'true'
        run: |
          echo "::error::No fragment in .changelog/: nothing to release."
          exit 1

      - name: Commit, tag and push
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md .changelog
          git commit -m "Release v$VERSION"
          git tag -a "$VERSION" -m "v$VERSION"
          git push origin HEAD:main "$VERSION"

  # A tag pushed with GITHUB_TOKEN does not start other workflows, so the
  # build and the GitHub release run in the same workflow.
  publish:
    name: Build and publish
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ inputs.version }}

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'

      - run: composer install --no-dev --optimize-autoloader

      - name: Build workflow
        run: ./scripts/build.sh

      - uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ inputs.version }}
          name: v${{ inputs.version }}
          body: ${{ needs.release.outputs.body }}
          prerelease: ${{ needs.release.outputs.prerelease }}
          artifacts: alfred-productive-workflow.alfredworkflow
