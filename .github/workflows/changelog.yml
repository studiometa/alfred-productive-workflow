name: Changelog

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Every change to the files shipped in the workflow archive needs a
      # fragment in .changelog/, unless the pull request has the
      # `no-changelog` label (tests, refactors, tooling, lock file updates).
      - uses: weareikko/changelog@cb24219df8d46e3549a6fe5c10e06f9b01e5011e # 1.0.1
        with:
          command: check
          require-paths: |
            src/**
            bin/**
            info.plist
            composer.json
