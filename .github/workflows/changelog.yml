name: Changelog

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Every change to the files shipped in the workflow archive needs a
      # fragment in .changelog/, unless the pull request has the
      # `no-changelog` label (tests, refactors, tooling, lock file updates).
      - uses: weareikko/changelog@0b4e3b5d6e33dc7f1379f2e822afbc7d5669c9b5 # 0.1.1
        with:
          command: check
          require-paths: |
            src/**
            bin/**
            info.plist
            composer.json
